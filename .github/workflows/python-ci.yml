name: python-pipline
  on:
   branches:
       -main
   pull-request:
      branches:
       -main

 jobs:
  build-and-test:
     runs-on:ubuntu-latest 
  steps:
      name:Checkout 
      uses:action/checkout@v4
  
    -name:install python
     uses: action/setup-python@v5
     with:
           python-version: '3.12'

    -name: requirements.txt
      run: |
         pip install -r requirements.txt

    -name: Run tests with pytest
      run: pytest

     

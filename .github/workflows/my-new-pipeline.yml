name: Pipeline

on:
 push:
   branches:
        -main
   pull_requst:
        -main

  jobs:
     build-test:
         runs-on: ubuntu-latest
        steps: 
           -name: Checkout
            uses: action/checkout@v4

      
           -name: install dependencies
                pip install -r  requirements.txt
          
           -name: Rinning test
            run: |
              pytest
 
           -name: Docker image
                docker build -t myapp:latest .


           -name: Run container
               docker run -d --name myapp-test myapp:latest


            -name: Wait
             run:  sleep 5


            -name: Check container
             run: |
               IS_RUNNING=$(docker inspect -f '{{.State.Running}}' myapp-test)
               echo "Contanier running status: $IS_RINNING"

            if ["IS_RINNING = "false"]; then
               docker logs myapp-test
               exit1
            fi






